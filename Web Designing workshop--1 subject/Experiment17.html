<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 17</title>
</head>
<body>
    <form action="#" method="POST">
       
        <input type="text" id="name" name="name" placeholder="Full Name" required><br><br>

        <input type="email" id="email" name="email" placeholder="you@college.edu" required><br><br>

        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required><br><br>

        <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required><br><br>

        <input type="number" id="age" name="age" placeholder="Age (17)"  min="1" max="30" required><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
