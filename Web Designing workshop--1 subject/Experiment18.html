<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 18</title>
    <style>
        header {
            padding: 10px;
            background-color: navy;
            color: white;
            text-align: center;
        }
        h2 {
            margin-left: 200px ;
        }
        table {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th{
            border: 1px solid black;
            padding: 10px;
            background-color: rgb(212, 212, 236);
            text-align: center;
            font-weight: bold;
        }
        form {
            width: 70%;
            margin: 20px auto;
            padding: 20px;
        }
        fieldset {
            border: 2px solid black;
            padding: 20px;
        }
        footer {
            padding: 2px;
            background-color: navy;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>
    <h2>Courses and Fees</h2>
    <table border="1" cellpadding="10" cellspacing="0">
        <caption>Available Courses</caption>
        <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>
        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>&#8377;90,000</td>
        </tr>
        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>&#8377;45,000</td>
        </tr>
      </table>


    <form>
       <fieldset>
            <legend>Application Form</legend>
              <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="course">Course:</label><br>
                <select id="course" name="course" required>
                  <option value="B.Tech CSE">B.Tech CSE</option>
                  <option value="BCA">BCA</option>
                </select><br><br>

                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="4" cols="50" required></textarea><br><br>
        
                <input type="submit" value="Apply">
        
        </fieldset>

    </form>


    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
