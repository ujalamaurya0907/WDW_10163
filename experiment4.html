<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
    <div>
    <form action = "#" method = "post"> <!--method takes 2 atributs either post or get--> 
       <label for="fullname">Full Name: </label>
         <input type = "text" id="fullname" name="fullname" required><br><br>
       <label for="email">Email: </label>
         <input type = "email" id="email" required><br><br>
       <label for="phone">Phone: </label>
         <input type = "tel" id="phone" required><br><br> 
       <label for="checkin">Check-in Date: </label>
          <input type = "date" id="checkin" required><br><br>
       <label for="checkout">Check-out Date: </label>  
          <input type = "date" id="checkout" required><br><br>
        <!--room type-->
        <label for="roomtype">Room Type: </label>
        <select id="roomtype" required>
            <option value="">Single Room</option>
            <option value="single">Double Room</option>
            <option value="double">Deluxe Room</option>
            <option value="suite">Suite</option>
        </select><br><br>
        <!--number of guests-->
        <label for="guests">Number of Guests: </label>
            <input type="number" id="guests" min="1" max="10" required><br><br>
        <label for="special request">Special Requests: </label><br>
            <textarea id="special request" name="special_request" rows="4" cols="50"></textarea><br><br>
        <!--submit and reset buttons-->
        <input type="submit" value="Submit Now"> <!--value holds the text displayed on the button-->
        <input type="reset" value="Reset Now">
        </form> 
    </div>

</body>
</html>
