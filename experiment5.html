<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5</title>
</head>
<body>
  <h1 align="center">Student Registration Form</h1>
  <hr>
  <form action="#" method="post">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label><br><br>

    <label for="course">Select Course:</label>
    <select id="course" name="course">
        <option value="">Select a course</option>
        <option value="ELCE">ELCE</option>
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
    </select><br><br>
    <label for="contact no.">Contact No.:</label>
    <input type="tel" id="contact no." name="contact no." placeholder="Enter phone number" required><br><br>
    <label for ="address">Address:</label>
    <textarea id="address" name="address" placeholder="Enter your address" rows="4" cols="50"></textarea><br><br>
    <input type="submit" value="Register">
    <input type="reset" value="Reset">
  </form>
  <hr>
  <p align="center">© 2025 Student Registration Form</p>
</body>
</html>
